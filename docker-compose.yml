# Локальный PostgreSQL для интеграционных тестов.
# Главный из них — контрактный: normalize.StreetKey (Go) обязан совпадать
# со street_key() (SQL) на всех 10 694 улицах прода. См. §4.1 архитектуры.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yfias
      POSTGRES_PASSWORD: yfias
      POSTGRES_DB: yfias_test
      # Тестовая база: durability не нужна, скорость нужна.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=256MB
    ports:
      - "55432:5432"
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yfias -d yfias_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
