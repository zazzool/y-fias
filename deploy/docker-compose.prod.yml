# Y-FIAS на проде, теневой режим (этап 3).
#
# Отличия от фрагмента в docs/06-deploy.md — по факту топологии porkyserv,
# а не по вкусу:
#
# 1. Сервиса `postgres` рядом НЕТ. Проверено 20.08.2026: на porkyserv своей
#    базы нет вовсе, бэкенд МИС ходит в PostgreSQL на соседней машине.
#    Поэтому ни `depends_on`, ни имени `postgres` здесь быть не может —
#    строка подключения указывает на тот же хост, что и DATABASE_URL у
#    mis-vizov.
# 2. Сеть — внешняя `current_default`, та же, в которой живёт mis-vizov.
#    Без неё имя `yfias` из бэкенда не разрешится, а теневая отправка молча
#    уйдёт в никуда: по устройству она не сообщает об ошибках.
# 3. Образ не собирается на сервере, а приезжает готовым (docker load).
#    Собранное локально и проверенное локально — это ровно то, что окажется
#    на проде.
#
# Порт наружу не публикуется, хотя доступ и закрыт API-ключами: в журнал
# попадает сырой ввод диспетчера — адреса вызовов психиатрической
# неотложки, специальная категория персональных данных (152-ФЗ, ст. 10).
# Ключ — вторая линия защиты, а не повод открывать порт.

services:
  yfias:
    image: yfias:${YFIAS_TAG:-20260820}
    container_name: yfias
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - yfias-data:/data:ro
    environment:
      TZ: Europe/Moscow
      # Хеши API-ключей (не сами ключи): «имя роль sha256:…» через запятую,
      # из .env рядом с этим файлом. Выпуск: docs/06-deploy.md, «Выпуск
      # ключей». Без них сервис не стартует.
      YFIAS_API_KEYS: ${YFIAS_API_KEYS:?нужны хеши ключей, см. docs/06-deploy.md}
    command:
      - "-addr=:8080"
      - "-snapshot=/data/gar.yfsnap"
      - "-geo=/data/geo.json"
      - "-coords=/data/coords.yfcoord"
      # Своя база: журнал теневых сравнений и очередь разбора. Без неё сервис
      # отвечает на подсказки полностью, но НЕ НАКАПЛИВАЕТ материал — то есть
      # неделя наблюдения не записывается никуда, а отчёт на админской
      # странице отвечает «журнал не подключён».
      - "-dsn=${YFIAS_DSN}"
      # -mis-dsn на первой неделе не задаётся: сверка адресов нужна
      # синхронизации, а она выключена. База МИС читается и НИКОГДА не
      # пишется — до этапа 5 таблица addresses принадлежит МИС.
      #
      # Синхронизация с ГАР выключена умолчанием: справочник собран 18.08.2026
      # и на неделю наблюдения свежий, а лишняя движущаяся часть при
      # наблюдении не нужна.
    networks:
      - nginx_net
    # Пик при старте — до 1 ГБ на несколько секунд, пока строятся индексы;
    # в работе около 430 МБ. Лимит ниже гигабайта означал бы, что сервис не
    # поднимется, хотя работал бы вчетверо экономнее.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 60s

volumes:
  yfias-data:
    external: true

networks:
  nginx_net:
    external: true
    name: current_default
